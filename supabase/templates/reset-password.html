<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fbf6ef;padding:32px 12px;">
  <tr><td align="center">
    <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px;width:100%;background:#ffffff;border-radius:20px;overflow:hidden;">
      <tr><td style="background:#2c1820;padding:22px 32px;text-align:center;">
        <span style="font-family:Georgia,'Times New Roman',serif;font-size:26px;color:#fbf6ef;">Clawsette <i>&amp;</i> Cookie Cart</span>
      </td></tr>
      <tr><td style="padding:32px;font-family:Arial,sans-serif;color:#2b2b2b;">
        <h1 style="margin:0 0 12px;font-family:Georgia,serif;font-size:24px;font-weight:500;">Reset your password</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.6;">We got a request to reset the password for this account. Enter the code below on the login page, then choose a new password.</p>
        <div style="background:#fbf6ef;border:1px dashed #ead7c3;border-radius:14px;padding:18px;text-align:center;">
          <span style="font-family:'Courier New',monospace;font-size:34px;font-weight:700;letter-spacing:8px;color:#2c1820;">{{ .Token }}</span>
        </div>
        <p style="margin:20px 0 0;font-size:13px;line-height:1.6;color:#777;">If you didn't ask for this, ignore this email. Your password won't change.</p>
      </td></tr>
      <tr><td style="padding:16px 32px;background:#fbf6ef;text-align:center;font-family:Arial,sans-serif;font-size:12px;color:#999;">Sent to {{ .Email }}</td></tr>
    </table>
  </td></tr>
</table>
